services:
  - type: web
    name: preco-certo-api
    runtime: dotnet
    rootDir: BackEnd/Pc.WebApi
    buildCommand: dotnet publish -c Release -o out
    startCommand: dotnet out/Pc.WebApi.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: PrecoCerto
      - key: Jwt__Audience
        value: PrecoCertoApp
      - key: Cors__AllowedOrigins__0
        sync: false
