services:
  - type: web
    name: preco-certo-api
    runtime: dotnet
    rootDir: BackEnd/Pc.WebApi
    buildCommand: dotnet publish -c Release -o out
    startCommand: dotnet out/Pc.WebApi.dll
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: PrecoCerto
      - key: Jwt__Audience
        value: PrecoCertoApp
      - key: Cors__AllowedOrigins__0
        sync: false
      # SMTP para confirmação de e-mail (opcional; defina no painel do Render)
      - key: Email__Host
        sync: false
      - key: Email__Port
        value: "587"
      - key: Email__User
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__From
        sync: false
      - key: Email__AppBaseUrl
        sync: false
